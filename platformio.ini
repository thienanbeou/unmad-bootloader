; MAD60 HE bootloader (sector 0). Build: pio run, then objcopy -O binary.
[env:mad60boot]
platform = ststm32
board = genericSTM32F405RG
framework = stm32cube
board_build.ldscript = boot.ld
lib_deps = https://github.com/hathach/tinyusb.git#0.20.0
build_flags =
	-Iinclude
	-DCFG_TUSB_MCU=OPT_MCU_STM32F4
	-Os
	-Wl,--print-memory-usage
build_src_flags =
	-Werror
	-Wall
	-Wextra
	-Wsign-conversion
	-Wno-unused-parameter
